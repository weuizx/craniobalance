components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API-токен из Настройки -> API.
  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      description: API ID аккаунта из Настройки -> API.
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      description: API ID пользователя из Настройки -> API.
      schema:
        type: string
  responses:
    GenericResponse:
      description: Ответ REST-обертки Клиентикс. Конкретная структура object зависит от метода.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericResponse'
    SendMessageResponse:
      description: Ответ коммуникационной операции. Прикладная ошибка может находиться в object при status=ok.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericResponse'
          examples:
            success:
              value:
                status: ok
                object:
                  clientFeedAction: Message
                  gateway: ClientixSMS
                  status: true
            businessError:
              value:
                status: ok
                messages:
                - Данные успешно изменены.
                object:
                  clientFeedAction: Message
                  success: false
                  error: В карточке клиента не отмечено согласие на получение смс-сообщений.
                  errorTitle: Не удалось отправить СМС
    SubClientsResponse:
      description: Пагинированный список субклиентов.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubClientsResponse'
    BalancesResponse:
      description: Список касс и финансовых счетов.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BalancesResponse'
  schemas:
    GenericResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          oneOf:
          - type: string
          - type: boolean
        messages:
          type: array
          items:
            type: string
        object:
          description: Результат или прикладная ошибка.
          type:
          - object
          - array
          - string
          - number
          - boolean
          - 'null'
          additionalProperties: true
        errors:
          description: Ошибки модели, когда backend submit вернул false.
          type:
          - object
          - array
          - 'null'
          additionalProperties: true
    SubClientsResponse:
      type: object
      required:
      - offset
      - limit
      - count
      - items
      properties:
        offset:
          type: integer
          description: 'Рекомендуемое смещение следующего запроса: текущий offset + limit.'
        limit:
          type: integer
        count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubClient'
