openapi: 3.1.0
info:
  title: Клиентикс CRM API
  version: '260605'
  description: 'Полная машинно-читаемая спецификация по статье «Методы API Клиентикс CRM v260605» #787. Все операции выполняются
    HTTP GET, включая создание и редактирование; параметры передаются в query string. Рекомендуемая внешняя авторизация: account_id
    и user_id в пути, токен в заголовке Authorization: Bearer. Авторизованная браузерная сессия может использовать путь без
    /a/{account_id}/u/{user_id}; вариант /t/{token} устарел и небезопасен. Лимит: не более 60 запросов в минуту на account_id
    с одного IP, не более 100 результатов за запрос, стандартный limit 50. Из-за использования GET для мутаций нельзя автоматически
    повторять, кэшировать или prefetch-ить add/edit-запросы.'
  x-source-article: https://klientikscrm.helpdeskeddy.com/ru/knowledge_base/article/787/category/62/
  x-authentication-variants:
    recommended: 'Authorization: Bearer {access_token}; account_id и user_id в URL'
    authorized-session: Без токена в URL/заголовке, только внутри действующей браузерной сессии
    legacy-deprecated: Токен в сегменте /t/{token}; не рекомендуется из-за утечки в логи и историю
  x-rate-limits:
    requestsPerMinutePerAccountPerIp: 60
    maxResultsPerRequest: 100
    defaultLimit: 50
externalDocs:
  description: Исходная документация Клиентикс CRM
  url: https://klientikscrm.helpdeskeddy.com/ru/knowledge_base/article/787/category/62/
servers:
- url: https://klientiks.ru/clientix/Restapi
  description: Клиентикс CRM
security:
- BearerAuth: []
tags:
- name: Создание
- name: Коммуникации
- name: Продажи
- name: Чтение
- name: Редактирование
- name: Склад
paths:
  /add/a/{account_id}/u/{user_id}/m/Clients/:
    get:
      tags:
      - Создание
      summary: Добавить клиента
      operationId: addClient
      description: Создает карточку клиента. Все значения передаются в query string.
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserId'
      - name: phone
        in: query
        required: true
        description: Телефон клиента.
        schema:
          type: string
        example: '71234445566'
      - name: first_name
        in: query
        required: true
        description: Имя клиента.
        schema:
          type: string
        example: Иван
      - name: patron_name
        in: query
        required: false
        description: Отчество клиента.
        schema:
          type: string
        example: Иванович
      - name: second_name
        in: query
        required: false
        description: Фамилия клиента.
        schema:
          type: string
        example: Иванов
      - name: email
        in: query
        required: false
        description: Email клиента.
        schema:
          type: string
          format: email
        example: test@test.com
      - name: client_groups
        in: query
        required: false
        description: Группы клиента через запятую.
        schema:
          type: array
          items:
            type: string
        example:
        - Новенький
        style: form
        explode: false
      - name: living_address
        in: query
        required: false
        description: Адрес клиента.
        schema:
          type: string
        example: Невский проспект, 25
      - name: sex
        in: query
        required: false
        description: 'Пол клиента: 1 - мужской, 0 - женский.'
        schema:
          type: integer
          enum:
          - 0
          - 1
        example: 1
      - name: appointment_confirmation_sms
        in: query
        required: false
        description: 'Согласие на получение SMS: 1 - согласен, 0 - не согласен.'
        schema:
          type: integer
          enum:
          - 0
          - 1
        example: 1
      - name: lead_source
        in: query
        required: false
        description: Источник клиента.
        schema:
          type: string
        example: Газета
      responses:
        '200':
          $ref: '#/components/responses/GenericResponse'
      security:
      - BearerAuth: []
      x-http-method-note: Документация Клиентикс требует HTTP GET, даже если операция изменяет данные.
      x-authorized-session-path: /add/m/Clients/
      x-legacy-token-in-url-path: /add/a/{account_id}/u/{user_id}/t/{token}/m/Clients/
  /add/a/{account_id}/u/{user_id}/m/Calls/:
    get:
      tags:
      - Создание
      summary: Добавить звонок
      operationId: addCall
      description: ''
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserId'
      - name: phone
        in: query
        required: true
        description: Телефон клиента. Если клиента с таким номером нет, он создается.
        schema:
          type: string
        example: '74445550011'
      - name: type
        in: query
        required: true
        description: Тип звонка.
        schema:
          type: string
          enum:
          - INCOMING
          - OUTGOING
        example: INCOMING
      - name: link
        in: query
        required: false
        description: Ссылка на запись звонка.
        schema:
          type: string
          format: uri
        example: https://example.invalid/call.mp3
      - name: status
        in: query
        required: true
        description: Статус звонка.
        schema:
          type: string
        example: ANSWERED
      - name: duration
        in: query
        required: true
        description: Длительность звонка в секундах.
        schema:
          type: integer
          minimum: 0
        example: 60
      - name: ext
        in: query
        required: true
        description: Добавочный номер сотрудника, который поднял трубку.
        schema:
          type: string
        example: '1234'
      - name: callid
        in: query
        required: true
        description: Идентификатор звонка.
        schema:
          type: string
        example: '150710871688943'
      - name: cmd
        in: query
        required: true
        description: event - уведомление о входящем звонке; history - создание записи о звонке.
        schema:
          type: string
          enum:
          - event
          - history
        example: event
      responses:
        '200':
          $ref: '#/components/responses/GenericResponse'
      security:
      - BearerAuth: []
      x-http-method-note: Документация Клиентикс требует HTTP GET, даже если операция изменяет данные.
      x-authorized-session-path: /add/m/Calls/
      x-legacy-token-in-url-path: /add/a/{account_id}/u/{user_id}/t/{token}/m/Calls/
  /add/a/{account_id}/u/{user_id}/m/Appointments/:
    get:
      tags:
      - Создание
      summary: Добавить визит в режиме одиночной записи
      operationId: addAppointment
      description: ''
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserId'
      - name: client_id
        in: query
        required: true
        description: Идентификатор клиента.
        schema:
          type: integer
        example: 709776
      - name: executor_id
        in: query
        required: true
        description: Идентификатор сотрудника-исполнителя.
        schema:
          type: integer
        example: 35509
      - name: status
        in: query
        required: true
        description: Статус визита.
        schema:
          type: string
          enum: &id001
          - cancelled
          - in_progress
          - scheduled
          - finished
          - missed
          - confirmed
          - cancelled_by_sms
          - sms_confirmation_sent
        example: scheduled
      - name: start_datetime
        in: query
        required: true
        description: Дата начала визита.
        schema:
          type: string
        example: '2017-12-21'
      - name: start_time
        in: query
        required: true
        description: Время начала, кратное 15 минутам.
        schema:
          type: string
        example: '12:00:00'
      - name: finish_datetime
        in: query
        required: true
        description: Дата завершения визита.
        schema:
          type: string
        example: '2017-12-21'
      - name: finish_time
        in: query
        required: true
        description: Время завершения, кратное 15 минутам.
        schema:
          type: string
        example: '12:30:00'
      - name: appointed_services
        in: query
        required: false
        description: Идентификаторы назначенных услуг через запятую.
        schema:
          type: array
          items:
            type: integer
        example:
        - 311667
        - 500204
        style: form
        explode: false
      - name: subclient_id
        in: query
        required: false
        description: Идентификатор субклиента для версии с субклиентами.
        schema:
          type: integer
        example: 11111
      responses:
        '200':
          $ref: '#/components/responses/GenericResponse'
      security:
      - BearerAuth: []
      x-http-method-note: Документация Клиентикс требует HTTP GET, даже если операция изменяет данные.
      x-authorized-session-path: /add/m/Appointments/
      x-legacy-token-in-url-path: /add/a/{account_id}/u/{user_id}/t/{token}/m/Appointments/
  /add/a/{account_id}/u/{user_id}/m/AppointmentClientLinks:
    get:
      tags:
      - Создание
      summary: Добавить клиента в групповой визит
      operationId: addClientToGroupAppointment
      description: ''
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserId'
      - name: appointment_id
        in: query
        required: true
        description: Идентификатор записи.
        schema:
          type: integer
        example: 1302873
      - name: client_id
        in: query
        required: true
        description: Идентификатор клиента.
        schema:
          type: integer
        example: 1064079
      - name: client_ids
        in: query
        required: false
        description: Массив идентификаторов клиентов через запятую.
        schema:
          type: array
          items:
            type: integer
        example:
        - 1064079
        - 1064080
        style: form
        explode: false
      - name: service_pack_id
        in: query
        required: false
        description: Идентификатор скидки или абонемента.
        schema:
          type: integer
        example: 95483
      - name: appointment_source
        in: query
        required: false
        description: Источник визита.
        schema:
          type: string
        example: Internet
      - name: internal_source
        in: query
        required: false
        description: Внутренний источник визита.
        schema:
          type: string
          enum:
          - INTERNAL_SOURCE_VK
          - INTERNAL_SOURCE_SITE
          - INTERNAL_SOURCE_CALL
      responses:
        '200':
          $ref: '#/components/responses/GenericResponse'
      security:
      - BearerAuth: []
      x-http-method-note: Документация Клиентикс требует HTTP GET, даже если операция изменяет данные.
      x-authorized-session-path: /add/m/AppointmentClientLinks
      x-legacy-token-in-url-path: /add/a/{account_id}/u/{user_id}/t/{token}/m/AppointmentClientLinks
  /add/a/{account_id}/u/{user_id}/m/Appointments/s/apiAdd/:
    get:
      tags:
      - Создание
      summary: Добавить визит для нового клиента
      operationId: addAppointmentForNewClient
      description: Создает визит и нового клиента. Для корректного подтверждения визитов рекомендуется отдельный API-пользователь.
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserId'
      - name: executor_id
        in: query
        required: true
        description: Идентификатор сотрудника-исполнителя.
        schema:
          type: integer
        example: 9413
      - name: service_id[]
        in: query
        required: true
        description: Один или несколько идентификаторов услуг. Повторите параметр для каждой услуги.
        schema:
          type: array
          items:
            type: integer
        example:
        - 136569
        style: form
        explode: true
      - name: start_datetime
        in: query
        required: true
        description: Дата и время начала визита.
        schema:
          type: string
        example: '2018-07-13 17:00:00'
      - name: first_name
        in: query
        required: true
        description: Имя клиента.
        schema:
          type: string
        example: Иван
      - name: phone
        in: query
        required: true
        description: Телефон клиента.
        schema:
          type: string
        example: '79111100005'
      - name: subclient_name
        in: query
        required: false
        description: Имя субклиента для версии с субклиентами.
        schema:
          type: string
      - name: appointment_id
        in: query
        required: false
        description: ID существующего визита при записи на групповое занятие.
        schema:
          type: integer
      - name: living_address
        in: query
        required: false
        description: Адрес клиента.
        schema:
          type: string
        example: Невский 1
      - name: birth_date
        in: query
        required: false
        description: Дата рождения клиента.
        schema:
          type: string
        example: 23.02.1991
      responses:
        '200':
          $ref: '#/components/responses/GenericResponse'
      security:
      - BearerAuth: []
      x-http-method-note: Документация Клиентикс требует HTTP GET, даже если операция изменяет данные.
      x-authorized-session-path: /add/m/Appointments/s/apiAdd/
      x-legacy-token-in-url-path: /add/a/{account_id}/u/{user_id}/t/{token}/m/Appointments/s/apiAdd/
      x-documentation-notes:
      - В аккаунте должен быть включен и настроен виджет онлайн-записи.
  /add/a/{account_id}/u/{user_id}/m/Appointments/s/waitingListItemAdd:
    get:
      tags:
      - Создание
      summary: Добавить запись в лист ожидания
      operationId: addWaitingListItem
      description: ''
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserId'
      - name: client_id
        in: query
        required: true
        description: Идентификатор клиента.
        schema:
          type: integer
        example: 709776
      - name: start_datetime
        in: query
        required: true
        description: Дата, на которую создается запись в лист ожидания.
        schema:
          type: string
        example: '2017-12-21'
      - name: urgent
        in: query
        required: false
        description: Флаг срочности.
        schema:
          type: integer
          enum:
          - 0
          - 1
        example: 1
      - name: executor_id
        in: query
        required: false
        description: Идентификатор сотрудника-исполнителя.
        schema:
          type: integer
        example: 35509
      - name: client_memo
        in: query
        required: false
        description: Комментарий, добавляемый к заметке клиента.
        schema:
          type: string
        example: Комментарий к визиту
      - name: appointment_source
        in: query
        required: false
        description: Источник визита.
        schema:
          type: string
        example: Вконтакте
      responses:
        '200':
          $ref: '#/components/responses/GenericResponse'
      security:
      - BearerAuth: []
      x-http-method-note: Документация Клиентикс требует HTTP GET, даже если операция изменяет данные.
      x-authorized-session-path: /add/m/Appointments/s/waitingListItemAdd
      x-legacy-token-in-url-path: /add/a/{account_id}/u/{user_id}/t/{token}/m/Appointments/s/waitingListItemAdd
  /add/a/{account_id}/u/{user_id}/m/ScheduleUnit/:
    get:
      tags:
      - Создание
      summary: Добавить расписание сотруднику
      operationId: addScheduleUnit
      description: ''
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserId'
      - name: user_id
        in: query
        required: true
        description: Идентификатор сотрудника или кабинета.
        schema:
          type: integer
        example: 37451
      - name: start_time
        in: query
        required: true
        description: Дата и время начала.
        schema:
          type: string
        example: 2017-12-23 10:00
      - name: end_time
        in: query
        required: true
        description: Дата и время окончания.
        schema:
          type: string
        example: 2017-12-23 18:00
      responses:
        '200':
          $ref: '#/components/responses/GenericResponse'
      security:
      - BearerAuth: []
      x-http-method-note: Документация Клиентикс требует HTTP GET, даже если операция изменяет данные.
      x-authorized-session-path: /add/m/ScheduleUnit/
      x-legacy-token-in-url-path: /add/a/{account_id}/u/{user_id}/t/{token}/m/ScheduleUnit/
  /add/a/{account_id}/u/{user_id}/m/Invoices/:
    get:
      tags:
      - Создание
      summary: Добавить оплату по счету
      operationId: addInvoicePayment
      description: ''
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserId'
      - name: id
        in: query
        required: true
        description: Идентификатор счета.
        schema:
          type: integer
        example: 481847
      - name: financial_account_id
        in: query
        required: true
        description: Идентификатор финансового счета (кассы).
        schema:
          type: integer
        example: 334436
      - name: amount
        in: query
        required: true
        description: Размер оплаты.
        schema:
          type: number
        example: 1000
      responses:
        '200':
          $ref: '#/components/responses/GenericResponse'
      security:
      - BearerAuth: []
      x-http-method-note: Документация Клиентикс требует HTTP GET, даже если операция изменяет данные.
      x-authorized-session-path: /add/m/Invoices/
      x-legacy-token-in-url-path: /add/a/{account_id}/u/{user_id}/t/{token}/m/Invoices/
  /add/a/{account_id}/u/{user_id}/m/Invoices/s/addForm/:
    get:
      tags:
      - Создание
      summary: Добавить счет
      operationId: addInvoice
      description: ''
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserId'
      - name: object_type
        in: query
        required: true
        description: Тип объекта, для которого создается счет.
        schema:
          type: string
          enum:
          - abonement
          - appointment
          - sale
        example: appointment
      - name: object_id
        in: query
        required: true
        description: Идентификатор объекта.
        schema:
          type: integer
        example: 1316987
      - name: client_id
        in: query
        required: true
        description: Идентификатор клиента.
        schema:
          type: integer
        example: 626297
      responses:
        '200':
          $ref: '#/components/responses/GenericResponse'
      security:
      - BearerAuth: []
      x-http-method-note: Документация Клиентикс требует HTTP GET, даже если операция изменяет данные.
      x-authorized-session-path: /add/m/Invoices/s/addForm/
      x-legacy-token-in-url-path: /add/a/{account_id}/u/{user_id}/t/{token}/m/Invoices/s/addForm/
  /add/a/{account_id}/u/{user_id}/m/DynamicFields/:
    get:
      tags:
      - Создание
      summary: Добавить динамическое поле
      operationId: addDynamicField
      description: ''
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserId'
      - name: model
        in: query
        required: true
        description: Модель, к которой добавляется поле.
        schema:
          type: string
        example: Clients
      - name: data
        in: query
        required: true
        description: JSON-массив с конфигурацией отображения нового поля. Передается URL-кодированным JSON.
        schema:
          type: string
        example: '[{"setJsonFields":["comment1"],"setRules":[["comment1","safe"]]}'
      responses:
        '200':
          $ref: '#/components/responses/GenericResponse'
      security:
      - BearerAuth: []
      x-http-method-note: Документация Клиентикс требует HTTP GET, даже если операция изменяет данные.
      x-authorized-session-path: /add/m/DynamicFields/
      x-legacy-token-in-url-path: /add/a/{account_id}/u/{user_id}/t/{token}/m/DynamicFields/
  /add/a/{account_id}/u/{user_id}/m/Clients/m/Notifications/:
    get:
      tags:
      - Создание
      summary: Добавить задачу
      operationId: addClientTask
      description: ''
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserId'
      - name: executor_id
        in: query
        required: true
        description: Идентификатор исполнителя.
        schema:
          type: integer
        example: 35499
      - name: client_id
        in: query
        required: false
        description: Идентификатор клиента. Используется вместо client_phone.
        schema:
          type: integer
        example: 1136308
      - name: client_phone
        in: query
        required: false
        description: Телефон клиента; работает, если client_id не указан.
        schema:
          type: string
      - name: planed_execution_datetime
        in: query
        required: true
        description: Плановая дата и время задачи в формате PHP datetime. Имя параметра содержит одну n согласно документации.
        schema:
          type: string
        example: '2018-03-24 16:45:00'
      - name: heading
        in: query
        required: true
        description: Заголовок задачи/уведомления.
        schema:
          type: string
        example: Тест задачи
      - name: message
        in: query
        required: true
        description: Текст задачи/уведомления.
        schema:
          type: string
        example: А вот и он
      responses:
        '200':
          $ref: '#/components/responses/GenericResponse'
      security:
      - BearerAuth: []
